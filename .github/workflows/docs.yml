name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.128.0'

      - name: Setup Pandoc
        uses: pandoc/setup-pandoc@v1
        with:
          pandoc-version: '3.1.12'

      - name: Convert markdown tables to HTML
        run: |
          # Extract and convert providers table
          sed -n '30,52p' docs/content/_index.md > /tmp/table.md
          pandoc -t html /tmp/table.md > /tmp/table.html
          # Replace markdown table with HTML in place
          sed -i '30,52d' docs/content/_index.md
          sed -i '29r /tmp/table.html' docs/content/_index.md

      - name: Build documentation
        run: |
          hugo --source docs
          # Fix relative links to include base path
          find docs/public -name "*.html" -exec sed -i 's|href="provider-|href="/crossplane-providers/provider-|g' {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
