site_name: Crossplane Providers
site_description: A collection of lean, focused Crossplane providers designed for efficiency and operational simplicity.
site_author: Ross Golder
site_url: https://rossigee.github.io/crossplane-providers/

docs_dir: docs

nav:
  - Home: index.md
  - Architecture:
      - "Introspection and Drift Detection": introspection_and_drift_detection.md
      - "Provider Vault Migration": provider_vault_migration.md

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossigee/crossplane-providers

copyright: Copyright &copy; 2025 Ross Golder