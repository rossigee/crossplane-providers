site_name: Crossplane Providers
site_description: A collection of lean, focused Crossplane providers designed for efficiency and operational simplicity.
site_author: Ross Golder
site_url: https://rossigee.github.io/crossplane-providers/

# docs_dir auto-discovered from config location (docs/)

nav:
  - Home: index.md
  - Standards:
      - Overview: standards/README.md
      - Platform Baseline: standards/platform.md
      - README Standard: standards/readme-standard.md
  - Troubleshooting: troubleshooting.md
  - Maintenance History: maintenance-history.md

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossigee/crossplane-providers

copyright: Copyright &copy; 2025 Ross Golder